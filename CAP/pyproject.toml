[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "coarse-alpha-sapiens"
version = "0.1.0"
description = "CAP: Sapiens-based coarse alpha prediction"
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
where = ["src"]
include = ["coarse_alpha*"]
